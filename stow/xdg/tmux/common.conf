setw -g mode-keys vi
set -g extended-keys always
set -g extended-keys-format csi-u
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g escape-time 100
set -g renumber-windows on
set -g status-position bottom
set -g status-left '[#S] '
set -g status-left-length 25
set -g status-right '   %d/%m/%y %H:%M   '
# Subtly dim inactive window labels while retaining the theme's background.
setw -g window-status-style 'fg=colour250'
setw -g window-status-current-style 'fg=colour255'
set -s set-clipboard on
set -g allow-passthrough all

# Resolve against this installed file, not the launching shell's working directory.
run-shell 'sh #{q;d:current_file}/brew-zsh.sh #{q:socket_path}'

# Pane splits retain the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
